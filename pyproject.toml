[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trust-score"
version = "0.1.0"
description = "Agent Trust Score — a transparent 0..1 trust signal for agents (AGenNext)."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = ["trust_score"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
