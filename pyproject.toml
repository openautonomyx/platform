[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agx-adr"
version = "0.1.0"
description = "agx-ADR — Agentic Detection & Response (reference sketch of arXiv 2605.17380) for the agx security plane."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = ["agx_adr"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
