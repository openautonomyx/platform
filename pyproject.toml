[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-handoff-protocol"
version = "0.1.0"
description = "Agent Handoff Protocol — one agent delegates a task to another, with identity + trust (AGenNext)."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = ["handoff_protocol"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
