# Fly.io deployment for MetaKube.
#
# First time:  fly launch --no-deploy --copy-config   (creates the app)
# Deploy:      fly deploy
# Custom domain:
#   fly certs add api.your-domain.com   (then add the shown DNS records)
#
# Fly builds the repo Dockerfile and runs the non-root distroless image.

app = "metakube"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "GET"
    path = "/readyz"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
