apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: metakube
  labels:
    app.kubernetes.io/name: metakube
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: metakube
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
