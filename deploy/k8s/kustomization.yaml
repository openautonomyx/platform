apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: metakube

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml

commonLabels:
  app.kubernetes.io/part-of: metakube

# Pin the image tag here (or override with `kustomize edit set image`).
images:
  - name: metakube
    newName: metakube
    newTag: latest
